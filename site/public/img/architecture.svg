<svg xmlns="http://www.w3.org/2000/svg" width="900" height="832" viewBox="0 0 900 832" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- The whole Debrief project on one page, drawn in the style of pipeline.svg.
       Site-only: not synced from ../Debrief. -->
