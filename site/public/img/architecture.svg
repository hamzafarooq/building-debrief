  <text x="88" y="200" font-size="11" fill="#141413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.vtt</text>

  <rect x="166" y="164" width="150" height="50" rx="9" fill="#FBEFE9" stroke="#E7BCA6"/>
